<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>StayFlow</title>
</head>
<body>
    
    <header id="header">

        
    </header>

    <main>

        <section class="contact-section">

            <h2>Our Contacts</h2>

            <p>Get In Touch With Us For Reservations, Booking And Enquiries.</p>

            <div class="contact-content container">

                <div class="contact-info">

                   <h3>Get In Touch</h3>

               <p>
                   <i class="fa-solid fa-phone"></i>
                   <a href="tel:+260775544529">+260 576 837 458</a>
              </p>

              <p>
                  <i class="fa-solid fa-envelope"></i>
                  <a href="mailto:info@stayflowpremium.com">info@izeniresort.com</a>
             </p>

              <p>
                 <i class="fa-solid fa-globe"></i>
                 <a href="#">www.izeniresort.com</a>
              </p>

            </div>

    <form class="contact-form">

    <label for="name">Full Name</label>
    <input 
        type="text" 
        id="name" 
        name="name"
        placeholder="Enter your full name"
        required
    >

    <label for="email">Email Address</label>
    <input 
        type="email" 
        id="email" 
        name="email"
        placeholder="Enter your email address"
        required
    >

    <label for="message">Message</label>

           <textarea 
                id="message" 
                name="message"
                placeholder="Hello Izeni Resort, I would like to make an enquiry."
                required
            ></textarea>

              <button type="submit" class="contact-btn">
                    Send Message
               </button>

            </form>

            </div>

        </section>

    </main>

    <footer id="footer">
        

    </footer>



    <script type="module" src="js/app.js"></script>
</body>
</html>
