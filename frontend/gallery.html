<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Izeni Resort | Gallery</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
     <header id="header">

        
    </header>


    <main>

        <!-- Gallery Hero -->
        <section class="gallery-hero">

            <div class="container">

                <div class="gallery-heading">

                    <span class="gallery-eyebrow">
                        Izeni Resort
                    </span>

                    <h1>
                        Explore Our Resort
                    </h1>

                    <p>
                        Take a look at the accommodation, dining,
                        surroundings and experiences waiting for you
                        at Izeni Resort.
                    </p>

                </div>

            </div>

        </section>


        <!-- Gallery -->
        <section class="gallery-section">

            <div class="container">

                <!-- Filters -->
                <div class="gallery-filters">

                    <button
                        class="gallery-filter active"
                        data-filter="all">
                        All
                    </button>

                    <button
                        class="gallery-filter"
                        data-filter="rooms">
                        Rooms
                    </button>

                    <button
                        class="gallery-filter"
                        data-filter="resort">
                        Resort
                    </button>

                    <button
                        class="gallery-filter"
                        data-filter="dining">
                        Dining
                    </button>

                    <button
                        class="gallery-filter"
                        data-filter="activities">
                        Activities
                    </button>

                </div>


                <!-- Gallery Grid -->
                <div
                    class="gallery-grid"
                    id="gallery-grid">
                </div>

            </div>

        </section>


        <!-- CTA -->
        <section class="gallery-cta">

            <div class="container">

                <div class="gallery-cta-content">

                    <h2>
                        Ready to Experience Izeni Resort?
                    </h2>

                    <p>
                        Discover comfortable accommodation,
                        beautiful surroundings and memorable
                        experiences.
                    </p>

                    <a href="contact.html" class="btn">
                        Make an Enquiry
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer id="footer">


    </footer>


    <!-- Components -->
    <script type="module" src="js/app.js"></script>
    
</body>

</html>
